<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Modele — Project-1</title>
<style>
  :root { --top: 76px; --bg: #1b1a17; --panel: #24221d; --line: #3a362d; --text: #e8e0cc; --dim: #a89e86; --gold: #d8b25a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.4 Georgia, 'Times New Roman', serif; overflow: hidden; }
  #c { position: fixed; inset: var(--top) 0 0 260px; width: calc(100% - 260px); height: calc(100% - var(--top)); display: block; }
  aside { position: fixed; left: 0; top: var(--top); bottom: 0; width: 260px; background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; padding: 14px 12px 24px; }
  h1 { font-size: 18px; margin: 0 0 4px; color: var(--gold); letter-spacing: .02em; }
  .hint { color: var(--dim); font-size: 12.5px; margin: 0 0 12px; }
  h2 { font-size: 13px; margin: 16px 0 6px; color: var(--dim); text-transform: uppercase; letter-spacing: .08em; }
  .list { display: flex; flex-wrap: wrap; gap: 4px; }
  .list button, .bar button { font: inherit; font-size: 13px; color: var(--text); background: #2e2b24; border: 1px solid var(--line); padding: 5px 8px; cursor: pointer; min-height: 30px; }
  .list button:hover, .bar button:hover { border-color: var(--gold); }
  .list button[aria-pressed="true"], .bar button[aria-pressed="true"] { background: #4a3e22; border-color: var(--gold); color: #fff3d0; }
  button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .bar button.ico { width: 32px; height: 32px; min-height: 32px; padding: 0; display: inline-grid; place-items: center; }
  .bar button:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }
  .bar .ico-sep { width: 1px; align-self: stretch; margin: 2px 4px; background: var(--line); }
  .bar .edit-tools [hidden] { display: none !important; }
  /* górna belka jak w programach graficznych: menu + pasek narzędzi na całą szerokość */
  #appbar { position: fixed; top: 0; left: 0; right: 0; height: var(--top); z-index: 8; background: #1f1d19; border-bottom: 1px solid #4a3f2a; display: flex; flex-direction: column; }
  .menubar { display: flex; align-items: stretch; height: 32px; padding: 0 6px; border-bottom: 1px solid var(--line); background: #191814; }
  .brand { color: var(--gold); font-weight: 600; padding: 0 12px 0 6px; align-self: center; letter-spacing: .03em; }
  .menu-top { font: inherit; font-size: 13.5px; color: var(--text); background: none; border: 0; padding: 0 11px; cursor: pointer; }
  .menu-top:hover, .menu-top[aria-expanded="true"] { background: #2e2b24; color: #fff3d0; }
  .menu-list { position: fixed; z-index: 30; min-width: 230px; background: #24221d; border: 1px solid #5a4a2c; box-shadow: 0 6px 18px rgba(0,0,0,.45); padding: 4px 0; display: flex; flex-direction: column; }
  .menu-list .menu-sub { position: absolute; left: 100%; margin-left: -2px; }
  .menu-list > button { font: inherit; font-size: 13px; color: var(--text); background: none; border: 0; display: grid; grid-template-columns: 18px 1fr auto; gap: 8px; align-items: center; text-align: left; padding: 6px 12px 6px 8px; min-height: 30px; cursor: pointer; }
  .menu-list > button:hover:not(:disabled), .menu-list > button:focus-visible { background: #4a3e22; color: #fff3d0; outline: none; }
  .menu-list > button:disabled { color: #7a715e; cursor: default; }
  .menu-check { color: var(--gold); text-align: center; }
  .menu-key { color: var(--dim); font-size: 12px; }
  .menu-sep { height: 1px; background: var(--line); margin: 4px 0; }
  .bar { flex: 1; display: flex; gap: 4px; align-items: center; padding: 0 8px; min-width: 0; overflow-x: auto; }
  .bar .view-tools { order: 2; margin-left: auto; display: flex; gap: 4px; }
  .bar .edit-tools { order: 1; }
  .edit-inspector button:not([draggable]) { font: inherit; font-size: 12.5px; color: var(--text); background: #2e2b24; border: 1px solid var(--line); padding: 4px 10px; min-height: 28px; cursor: pointer; }
  .edit-inspector button:hover { border-color: var(--gold); }
  .bar .view-tools button { font-size: 12.5px; padding: 4px 8px; min-height: 30px; }
  #info { position: fixed; left: 274px; bottom: 10px; color: var(--dim); font-size: 12.5px; background: rgba(20,19,16,.7); padding: 5px 9px; }
  .fold { position: fixed; left: 260px; top: calc(50% + var(--top) / 2); transform: translateY(-50%); z-index: 6; width: 22px; min-height: 56px; font: inherit; color: var(--text); background: #2e2b24; border: 1px solid var(--line); border-left: 0; cursor: pointer; padding: 0; }
  .fold:hover { border-color: var(--gold); }
  body.folded aside { display: none; }
  body.folded { --insp-left: 0px; }
  body.folded .fold { left: 0; }
  body.folded #c { inset: 0; width: 100%; }
  body.folded #info, body.folded #name { left: 30px; }
  #name { position: fixed; left: 274px; top: calc(var(--top) + 10px); font-size: 20px; color: #fff3d0; text-shadow: 0 1px 3px #000; }
</style>
</head>
<body>
<aside>
  <p class="hint">Mysz: lewy — obrót, prawy — przesuw, kółko — przybliżenie. Model pojawia się sam, w zwykłym świetle i pełnej jakości. Adres: <code>modele.html?id=tavern</code>.</p>
  <div id="groups"></div>
</aside>
<header id="appbar">
  <div class="menubar"><span class="brand">Modele</span><nav id="menus" aria-label="Menu" style="display:flex"></nav></div>
  <div class="bar" id="bar"></div>
</header>
<canvas id="c"></canvas>
<div id="name"></div>
<div id="info"></div>
<script type="module" src="./src/viewerboot.ts"></script>
</body>
</html>
