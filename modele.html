<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Modele — Project-1</title>
<style>
  :root { --bg: #1b1a17; --panel: #24221d; --line: #3a362d; --text: #e8e0cc; --dim: #a89e86; --gold: #d8b25a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.4 Georgia, 'Times New Roman', serif; overflow: hidden; }
  #c { position: fixed; inset: 0 0 0 260px; width: calc(100% - 260px); height: 100%; display: block; }
  aside { position: fixed; left: 0; top: 0; bottom: 0; width: 260px; background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; padding: 14px 12px 24px; }
  h1 { font-size: 18px; margin: 0 0 4px; color: var(--gold); letter-spacing: .02em; }
  .hint { color: var(--dim); font-size: 12.5px; margin: 0 0 12px; }
  h2 { font-size: 13px; margin: 16px 0 6px; color: var(--dim); text-transform: uppercase; letter-spacing: .08em; }
  .list { display: flex; flex-wrap: wrap; gap: 4px; }
  .list button, .bar button { font: inherit; font-size: 13px; color: var(--text); background: #2e2b24; border: 1px solid var(--line); padding: 5px 8px; cursor: pointer; min-height: 30px; }
  .list button:hover, .bar button:hover { border-color: var(--gold); }
  .list button[aria-pressed="true"], .bar button[aria-pressed="true"] { background: #4a3e22; border-color: var(--gold); color: #fff3d0; }
  button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .bar { position: fixed; top: 10px; right: 12px; display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; max-width: calc(100% - 290px); }
  #info { position: fixed; left: 274px; bottom: 10px; color: var(--dim); font-size: 12.5px; background: rgba(20,19,16,.7); padding: 5px 9px; }
  #name { position: fixed; left: 274px; top: 10px; font-size: 20px; color: #fff3d0; text-shadow: 0 1px 3px #000; }
</style>
</head>
<body>
<aside>
  <h1>Modele</h1>
  <p class="hint">Mysz: lewy — obrót, prawy — przesuw, kółko — przybliżenie. Model pojawia się sam, w zwykłym świetle i pełnej jakości. Adres: <code>modele.html?id=tavern</code>.</p>
  <div id="groups"></div>
</aside>
<canvas id="c"></canvas>
<div id="name"></div>
<div class="bar" id="bar"></div>
<div id="info"></div>
<script type="module" src="./src/viewer.ts"></script>
</body>
</html>
