<!doctype html><meta charset="utf-8"><title>podgląd zwierząt</title>
<body style="margin:0;background:#3b4428"><canvas id="c" width="1200" height="700"></canvas>
<script type="module">
// Podgląd wilka i kruków z bliska: ?d=odległość&pitch=kąt&yaw=obrót (bez całej mapy)
import * as THREE from 'three';
import { loadModels } from './src/render/modelstore.ts';
await loadModels();
const { crowGeometry, WOLF_HIPS, WOLF_TAIL, wolfParts } = await import('./src/render/creatures.ts');
const { animalGeo, ANIMAL_AT } = await import('./src/render/village.ts');
const q = new URLSearchParams(location.search);
const dist = Number(q.get('d') ?? 2.0), pitch = Number(q.get('pitch') ?? 0.3), yaw = Number(q.get('yaw') ?? 0.9);
const r = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true });
r.shadowMap.enabled = true; r.toneMapping = THREE.ACESFilmicToneMapping; r.outputColorSpace = THREE.SRGBColorSpace;
const s = new THREE.Scene(); s.background = new THREE.Color(0x56603a);
s.add(new THREE.HemisphereLight(0xcfd8e8, 0x4a4a30, 1.1));
const sun = new THREE.DirectionalLight(0xffe6c0, 2.6); sun.position.set(3, 5, 4); sun.castShadow = true; sun.shadow.mapSize.setScalar(2048);
Object.assign(sun.shadow.camera, { left: -2, right: 2, top: 2, bottom: -2 }); s.add(sun);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(10, 10), new THREE.MeshStandardMaterial({ color: 0x5d6a3a, roughness: 1 })); ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; s.add(ground);
const wp = wolfParts();
const wolf = (x, z, ry, run, tailUp) => {
  const g = new THREE.Group();
  g.add(new THREE.Mesh(wp.body, wp.mat));
  WOLF_HIPS.forEach(([hx, hy, hz], k) => { const m = new THREE.Mesh(k < 2 ? wp.leg : wp.hindLeg, wp.mat); m.position.set(hx, hy, hz); m.rotation.x = run * (k === 0 || k === 3 ? 1 : -1); g.add(m); });
  const t = new THREE.Mesh(wp.tail, wp.mat); t.position.set(...WOLF_TAIL); t.rotation.x = tailUp; g.add(t);
  g.add(new THREE.Mesh(wp.eyes, new THREE.MeshBasicMaterial({ color: 0xffd24a })));
  g.traverse((o) => { if (o.isMesh) o.castShadow = true; });
  g.position.set(x, 0, z); g.rotation.y = ry; s.add(g);
};
wolf(-0.35, 0, Math.PI / 2, 0, 0.5);
wolf(0.45, -0.3, -0.6, 0.5, 1.9);
const cm = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.6 });
[[0.1, 0.45, 2.4, 0], [0.4, 0.35, -0.9, 0.5]].forEach(([x, z, ry, peck]) => { const m = new THREE.Mesh(crowGeometry(), cm); m.castShadow = true; m.scale.setScalar(1.25 * Number(q.get('kruk') ?? 1)); m.position.set(x, 0, z); m.rotation.set(peck, ry, 0, 'YXZ'); s.add(m); });
if (q.get('osada')) {
  // zwierzęta w osadzie: kury, świnia, koń, pies (sylwetka wilka w płowej sierści)
  s.children.filter((o) => o.type === 'Group' || (o.isMesh && o !== ground)).forEach((o) => s.remove(o));
  const vm = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.9 });
  const put = (geo, x, z, ry, color) => { const m = new THREE.Mesh(geo, color ? new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.9, color }) : vm); m.position.set(x, 0, z); m.rotation.y = ry; m.castShadow = true; s.add(m); return m; };
  [[-0.5, 0.3, 0.6, 'hen_white'], [-0.35, 0.45, 2.2, 'hen_brown'], [-0.6, 0.5, -0.8, 'hen_black']].forEach(([x, z, r, k]) => put(animalGeo(k), x, z, r));
  put(animalGeo('pig'), -0.05, 0.25, 0.9);
  const hb = put(animalGeo('horse_body'), 0.5, -0.2, -0.5);
  const nk = new THREE.Mesh(animalGeo('horse_neck'), vm); nk.position.set(...ANIMAL_AT.neck); nk.rotation.x = Number(q.get('graze') ?? 0.2); hb.add(nk);
  const tl = new THREE.Mesh(animalGeo('horse_tail'), vm); tl.position.set(...ANIMAL_AT.tail); tl.rotation.x = 0.35; hb.add(tl);
  const dog = new THREE.Group(); dog.add(new THREE.Mesh(animalGeo('dog_body'), vm));
  ANIMAL_AT.dogHips.forEach(([hx, hy, hz], k) => { const m = new THREE.Mesh(animalGeo(k < 2 ? 'dog_leg' : 'dog_hind'), vm); m.position.set(hx, hy, hz); dog.add(m); });
  const dt = new THREE.Mesh(animalGeo('dog_tail'), vm); dt.position.set(...ANIMAL_AT.dogTail); dt.rotation.x = 2.5; dog.add(dt);
  dog.position.set(0.15, 0, 0.55); dog.rotation.y = 0.4; dog.traverse((o) => { if (o.isMesh) o.castShadow = true; }); s.add(dog);
}
const cam = new THREE.PerspectiveCamera(30, 1200 / 700, 0.05, 50);
const look = Number(q.get('y') ?? 0.25), cx = Number(q.get('x') ?? 0), cz = Number(q.get('z') ?? 0);
cam.position.set(cx + Math.sin(yaw) * Math.cos(pitch) * dist, look + Math.sin(pitch) * dist, cz + Math.cos(yaw) * Math.cos(pitch) * dist); cam.lookAt(cx, look, cz);
r.render(s, cam); document.title = 'gotowe';
</script>
