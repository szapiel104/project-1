name: Testy i wdrożenie

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # mapy źródeł (do tłumaczenia stosu błędów z dziennika gry, tools/check/stack.mjs) nie idą na stronę:
      # zostają jako artefakt tego przebiegu (30 dni), a z dist/ są usuwane przed wdrożeniem
      - run: mkdir -p sourcemaps && cd dist && find . -name '*.map' -exec cp --parents {} ../sourcemaps/ \; -delete
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: sourcemaps
          path: sourcemaps
          retention-days: 30
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
