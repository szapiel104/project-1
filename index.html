<body>
<canvas id="game" tabindex="0" aria-label="Mapa gry"></canvas>
<div id="ui"></div>
<div id="loading" role="status" aria-live="polite">
  <p class="loading-ver">v%GAME_VERSION%</p>
  <div class="loading-head">
    <div class="loading-crest"><svg viewBox="0 0 120 120" aria-hidden="true"><path d="M18 34 L102 86 M102 34 L18 86" stroke="#5a3a1c" stroke-width="5" stroke-linecap="round"/><path d="M14 30 l8 2 -2 8z M106 30 l-8 2 2 8z" fill="#b9b2a2"/><path d="M60 12 L96 22 V56 C96 82 78 98 60 108 C42 98 24 82 24 56 V22 Z" fill="#8c1f18" stroke="#e9c145" stroke-width="4"/><path d="M60 18 L90 26 V56 C90 78 75 92 60 101 Z" fill="#6e1711"/><path d="M46 84 V52 h4 v-6 h5 v6 h10 v-6 h5 v6 h4 V84 Z" fill="#e9c145"/><path d="M56 84 v-12 a4 4 0 0 1 8 0 v12z" fill="#6e1711"/></svg></div>
    <p class="loading-title has-logo" role="img" aria-label="Project-1"></p>
    <p class="loading-sub">Zbuduj osadę, wykarm ludzi, obroń zamek</p>
  </div>
  <div class="loading-card">
    <p class="loading-tip" id="loading-tip"></p>
    <div class="loading-bar"><span id="loading-fill"></span></div>
    <p class="loading-line"><span id="loading-label">Wczytywanie gry…</span> <strong id="loading-count"></strong></p>
  </div>
</div>
<script>
// Po wdrożeniu nowej wersji przeglądarka bywa ze starą stroną z pamięci (GitHub Pages trzyma ją do 10 min), a stare
// pliki gry już nie istnieją — gra stała wtedy w nieskończoność na ekranie wczytywania (Michał 3.11.2026: „nie
// wczytał się”). Gdy któryś plik gry się nie pobierze, wczytujemy stronę jeszcze raz z pominięciem pamięci
// (najwyżej raz na minutę, żeby przy braku sieci nie kręcić się w kółko).
(function () {
  function fresh() {
    try { var t = +sessionStorage.getItem('p1-fresh') || 0; if (Date.now() - t < 60000) return false; sessionStorage.setItem('p1-fresh', String(Date.now())); } catch (e) { /* bez sessionStorage też próbujemy */ }
    var u = new URL(location.href); u.searchParams.set('v', Date.now().toString(36)); location.replace(u.href);
    return true;
  }
  window.__fresh = fresh;
  addEventListener('error', function (e) { var t = e.target; if (t && (t.tagName === 'SCRIPT' || (t.tagName === 'LINK' && /stylesheet|modulepreload/.test(t.rel)))) fresh(); }, true);
  addEventListener('vite:preloadError', function (e) { console.error('[preloadError]', e.payload && (e.payload.stack || e.payload.message || e.payload)); e.preventDefault(); fresh(); });
})();
</script>
<script type="module" src="./src/boot.ts"></script>
</body>
</html>
